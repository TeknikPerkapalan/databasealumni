<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Alumni · Portal Alumni TP UNDIP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/src/config/tailwind.js"></script>
  <link rel="stylesheet" href="/src/styles/main.css" />
  <script src="/env.js" onerror=""></script>
</head>
<body class="min-h-screen bg-[#fafbfc]">

  <header class="bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <span class="w-10 h-10 rounded-xl bg-navy-900 grid place-content-center text-gold-400">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.9.94 5.34 2.81 7.76"/><path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6"/></svg>
        </span>
        <div class="font-display font-semibold text-navy-900">Portal Alumni TP UNDIP</div>
      </a>
      <a href="/login.html" class="text-sm text-navy-700 hover:text-navy-900">Sudah punya akun? <span class="font-semibold underline">Masuk</span></a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-12">
    <div class="badge badge-gold">Pendaftaran Alumni</div>
    <h1 class="font-display text-3xl sm:text-4xl font-semibold text-navy-900 mt-3 tracking-tight">Bergabunglah dengan keluarga besar Teknik Perkapalan</h1>
    <p class="mt-2 text-slate-600">Lengkapi formulir berikut. Profilmu dapat diperbarui kapan saja.</p>

    <form id="register-form" class="mt-10 card p-6 lg:p-10 space-y-8">
      <!-- Identitas -->
      <section>
        <h2 class="font-display text-xl font-semibold text-navy-900">Identitas</h2>
        <div class="grid sm:grid-cols-2 gap-4 mt-4">
          <div class="sm:col-span-2">
            <label class="label" for="full_name">Nama lengkap *</label>
            <input id="full_name" name="full_name" required class="input" placeholder="Sesuai ijazah"/>
          </div>
          <div>
            <label class="label" for="nim">NIM</label>
            <input id="nim" name="nim" class="input" placeholder="21XXXXXXXXXXXX"/>
          </div>
          <div>
            <label class="label" for="angkatan">Angkatan *</label>
            <input id="angkatan" name="angkatan" type="number" min="1990" max="2030" required class="input" placeholder="2016"/>
          </div>
          <div>
            <label class="label" for="tahun_lulus">Tahun lulus</label>
            <input id="tahun_lulus" name="tahun_lulus" type="number" min="1995" max="2035" class="input" placeholder="2020"/>
          </div>
          <div>
            <label class="label" for="no_hp">Nomor HP</label>
            <input id="no_hp" name="no_hp" class="input" placeholder="+62812xxxx"/>
          </div>
          <div class="sm:col-span-2">
            <label class="label" for="alamat">Alamat</label>
            <input id="alamat" name="alamat" class="input" placeholder="Kota tempat tinggal"/>
          </div>
        </div>
      </section>

      <!-- Akun -->
      <section>
        <h2 class="font-display text-xl font-semibold text-navy-900">Akun masuk</h2>
        <div class="grid sm:grid-cols-2 gap-4 mt-4">
          <div>
            <label class="label" for="email">Email *</label>
            <input id="email" name="email" type="email" required class="input" placeholder="nama@email.com" autocomplete="email"/>
          </div>
          <div>
            <label class="label" for="password">Password * <span class="text-slate-400">(min 8 karakter)</span></label>
            <input id="password" name="password" type="password" required minlength="8" class="input" placeholder="••••••••" autocomplete="new-password"/>
          </div>
        </div>
      </section>

      <!-- Karir -->
      <section>
        <h2 class="font-display text-xl font-semibold text-navy-900">Karir & lainnya</h2>
        <div class="grid sm:grid-cols-2 gap-4 mt-4">
          <div>
            <label class="label" for="status_kerja">Status</label>
            <select id="status_kerja" name="status_kerja" class="select">
              <option value="Bekerja">Bekerja</option>
              <option value="Wirausaha">Wirausaha</option>
              <option value="Studi Lanjut">Studi Lanjut</option>
              <option value="Belum Bekerja">Belum Bekerja</option>
            </select>
          </div>
          <div>
            <label class="label" for="tempat_kerja">Tempat kerja</label>
            <input id="tempat_kerja" name="tempat_kerja" class="input" placeholder="PT PAL Indonesia"/>
          </div>
          <div>
            <label class="label" for="jabatan">Jabatan</label>
            <input id="jabatan" name="jabatan" class="input" placeholder="Naval Architect"/>
          </div>
          <div>
            <label class="label" for="lokasi_kerja">Lokasi kerja</label>
            <input id="lokasi_kerja" name="lokasi_kerja" class="input" placeholder="Surabaya"/>
          </div>
          <div>
            <label class="label" for="linkedin_url">LinkedIn</label>
            <input id="linkedin_url" name="linkedin_url" type="url" class="input" placeholder="https://linkedin.com/in/..."/>
          </div>
          <div>
            <label class="label" for="instagram_url">Instagram</label>
            <input id="instagram_url" name="instagram_url" type="url" class="input" placeholder="https://instagram.com/..."/>
          </div>
          <div class="sm:col-span-2">
            <label class="label" for="bio">Bio singkat</label>
            <textarea id="bio" name="bio" class="textarea" rows="3" placeholder="Ceritakan sedikit tentang dirimu, ekspertise, dan minat profesional..."></textarea>
          </div>
        </div>
      </section>

      <div class="flex items-center gap-3 text-sm text-slate-600">
        <input type="checkbox" id="agree" required class="w-4 h-4"/>
        <label for="agree">Saya menyetujui penggunaan data untuk keperluan portal alumni.</label>
      </div>

      <button type="submit" class="btn btn-primary w-full">
        <span data-label>Daftar Sekarang</span>
        <svg data-loading class="hidden animate-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      </button>
    </form>
  </main>

  <script type="module">
    import { authService } from '/src/services/auth.service.js';
    import { toast }       from '/src/utils/toast.js';

    const form = document.getElementById('register-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd  = new FormData(form);
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.querySelector('[data-label]').textContent = 'Memproses...';
      btn.querySelector('[data-loading]').classList.remove('hidden');
      try {
        await authService.register({
          email:    fd.get('email').trim(),
          password: fd.get('password'),
          profile: {
            full_name:     fd.get('full_name').trim(),
            nim:           fd.get('nim') || null,
            angkatan:      Number(fd.get('angkatan')),
            tahun_lulus:   fd.get('tahun_lulus') ? Number(fd.get('tahun_lulus')) : null,
            alamat:        fd.get('alamat') || null,
            no_hp:         fd.get('no_hp') || null,
            tempat_kerja:  fd.get('tempat_kerja') || null,
            jabatan:       fd.get('jabatan') || null,
            lokasi_kerja:  fd.get('lokasi_kerja') || null,
            status_kerja:  fd.get('status_kerja'),
            linkedin_url:  fd.get('linkedin_url') || null,
            instagram_url: fd.get('instagram_url') || null,
            bio:           fd.get('bio') || null,
          },
        });
        toast.success('Pendaftaran berhasil! Cek email untuk verifikasi.');
        setTimeout(() => { window.location.href = '/login.html'; }, 1800);
      } catch (err) {
        console.error(err);
        toast.error(err.message || 'Gagal mendaftar.');
        btn.disabled = false;
        btn.querySelector('[data-label]').textContent = 'Daftar Sekarang';
        btn.querySelector('[data-loading]').classList.add('hidden');
      }
    });
  </script>
</body>
</html>
