<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alumni · Admin · Portal Alumni Perkapalan UNDIP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/src/config/tailwind.js"></script>
  <link rel="stylesheet" href="/src/styles/main.css" />
  <script src="/env.js" onerror=""></script>
</head>
<body class="bg-[#f6f7f9]">
  <div class="flex min-h-screen">
    <aside id="admin-sidebar"></aside>

    <main class="flex-1 lg:ml-64">
      <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="px-6 lg:px-10 py-4 flex items-center justify-between">
          <div>
            <p class="text-xs text-slate-500">Manajemen</p>
            <h1 class="font-display text-2xl font-semibold text-navy-950">Alumni & Pengguna</h1>
          </div>
          <button id="btn-export" class="btn btn-outline">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            Export CSV
          </button>
        </div>
      </header>

      <section class="p-6 lg:p-10 space-y-6">
        <!-- Filters -->
        <div class="card p-4 flex flex-col md:flex-row gap-3">
          <div class="relative flex-1">
            <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="f-search" placeholder="Cari nama atau email..." class="input pl-10" />
          </div>
          <select id="f-role" class="select md:w-48">
            <option value="">Semua Peran</option>
            <option value="alumni">Alumni</option>
            <option value="admin">Admin</option>
            <option value="super_admin">Super Admin</option>
          </select>
          <select id="f-active" class="select md:w-48">
            <option value="">Semua Status</option>
            <option value="true">Aktif</option>
            <option value="false">Nonaktif</option>
          </select>
        </div>

        <div class="card overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm min-w-[800px]">
              <thead class="bg-slate-50 text-slate-600 text-xs uppercase">
                <tr>
                  <th class="text-left px-5 py-3 font-medium">Nama</th>
                  <th class="text-left px-5 py-3 font-medium">Email</th>
                  <th class="text-left px-5 py-3 font-medium">Angkatan</th>
                  <th class="text-left px-5 py-3 font-medium">Tempat Kerja</th>
                  <th class="text-left px-5 py-3 font-medium">Peran</th>
                  <th class="text-left px-5 py-3 font-medium">Status</th>
                  <th class="px-5 py-3"></th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </div>

        <p class="text-xs text-slate-500" id="hint"></p>
      </section>
    </main>
  </div>

  <script type="module" src="/src/pages/admin/alumni.js"></script>
</body>
</html>
