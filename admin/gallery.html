<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeri · Admin · Portal Alumni Perkapalan UNDIP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/src/config/tailwind.js"></script>
  <link rel="stylesheet" href="/src/styles/main.css" />
  <script src="/env.js" onerror=""></script>
</head>
<body class="bg-[#f6f7f9]">
  <div class="flex min-h-screen">
    <aside id="admin-sidebar"></aside>

    <main class="flex-1 lg:ml-64">
      <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="px-6 lg:px-10 py-4 flex items-center justify-between">
          <div>
            <p class="text-xs text-slate-500">Konten</p>
            <h1 class="font-display text-2xl font-semibold text-navy-950">Kelola Galeri</h1>
          </div>
          <button id="btn-new-album" class="btn btn-primary">+ Album Baru</button>
        </div>
      </header>

      <section class="p-6 lg:p-10 space-y-6">
        <div id="albums" class="grid lg:grid-cols-3 md:grid-cols-2 gap-4"></div>
      </section>
    </main>
  </div>

  <!-- ALBUM MODAL -->
  <div id="modal-album" class="fixed inset-0 z-[100] hidden">
    <div class="absolute inset-0 bg-black/60" data-close></div>
    <div class="relative max-w-lg mx-auto top-12 bg-white rounded-2xl shadow-2xl">
      <div class="p-6 sm:p-8">
        <h3 class="font-display text-xl font-semibold text-navy-950">Album Baru</h3>
        <form id="form-album" class="mt-4 space-y-3">
          <div><label class="label">Judul Album</label><input name="title" class="input" required /></div>
          <div><label class="label">Deskripsi</label><textarea name="description" class="textarea" rows="3"></textarea></div>
          <div>
            <label class="label">Cover</label>
            <input id="cover-input" type="file" accept="image/*" class="input" />
          </div>
          <div class="flex justify-end gap-2 pt-3">
            <button type="button" data-close class="btn btn-ghost">Batal</button>
            <button type="submit" class="btn btn-primary">Buat Album</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- IMAGES MODAL -->
  <div id="modal-images" class="fixed inset-0 z-[100] hidden">
    <div class="absolute inset-0 bg-black/60" data-close-img></div>
    <div class="relative max-w-3xl mx-auto top-8 bg-white rounded-2xl shadow-2xl max-h-[90vh] flex flex-col">
      <div class="p-6 border-b border-slate-200 flex items-center justify-between">
        <h3 id="modal-images-title" class="font-display text-xl font-semibold text-navy-950">Foto Album</h3>
        <button data-close-img class="text-slate-400 hover:text-slate-600 p-1"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="p-6 overflow-y-auto thin-scroll flex-1">
        <label class="card p-6 flex flex-col items-center justify-center border-2 border-dashed cursor-pointer hover:border-navy-300 transition">
          <svg class="mb-2 text-slate-400" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3-3a2 2 0 0 0-3 0L6 21"/></svg>
          <p class="text-sm font-medium text-navy-950">Klik untuk unggah foto</p>
          <p class="text-xs text-slate-500 mt-1">Anda dapat memilih beberapa file sekaligus</p>
          <input id="multi-input" type="file" accept="image/*" multiple class="hidden" />
        </label>
        <div id="image-list" class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-4"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/pages/admin/gallery.js"></script>
</body>
</html>
