<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeri · Portal Alumni Perkapalan UNDIP</title>
  <meta name="description" content="Album foto kegiatan, reuni, dan momen berharga Alumni Teknik Perkapalan UNDIP." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/src/config/tailwind.js"></script>
  <link rel="stylesheet" href="/src/styles/main.css" />
  <script src="/env.js" onerror=""></script>
</head>
<body class="bg-[#fafbfc]">
  <div id="navbar"></div>

  <section class="bg-navy-950 text-white hero-grid">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 lg:py-24">
      <p class="text-gold-400 text-sm font-medium tracking-wide uppercase">Galeri</p>
      <h1 class="font-display font-semibold text-4xl sm:text-5xl mt-2">Momen Kebersamaan</h1>
      <p class="mt-3 text-slate-300 max-w-2xl">Setiap foto merekam cerita — kuliah, KKN, reuni, dan kegiatan komunitas.</p>
    </div>
  </section>

  <!-- ALBUM SELECTOR -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 -mt-10 relative z-10">
    <div class="bg-white rounded-2xl shadow-soft ring-1 ring-slate-200 p-4 lg:p-5">
      <div id="album-pills" class="flex flex-wrap gap-2"></div>
    </div>
  </section>

  <!-- ALBUM CARDS (when no album selected) -->
  <section id="album-section" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <h2 class="font-display text-2xl font-semibold text-navy-950 mb-6">Semua Album</h2>
    <div id="album-grid" class="grid lg:grid-cols-3 md:grid-cols-2 gap-6"></div>
  </section>

  <!-- IMAGE GRID -->
  <section id="image-section" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 hidden">
    <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
      <h2 id="album-title" class="font-display text-2xl font-semibold text-navy-950">Album</h2>
      <button id="btn-back" class="btn btn-ghost text-sm">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        Semua album
      </button>
    </div>
    <div id="image-grid" class="masonry"></div>
    <div id="load-more-wrap" class="text-center mt-8 hidden">
      <button id="btn-load-more" class="btn btn-outline">Muat lebih banyak</button>
    </div>
  </section>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox hidden">
    <button id="lb-close" class="absolute top-4 right-4 text-white/80 hover:text-white p-2" aria-label="Tutup">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <button id="lb-prev" class="absolute left-4 top-1/2 -translate-y-1/2 text-white/80 hover:text-white p-3" aria-label="Sebelumnya">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <button id="lb-next" class="absolute right-4 top-1/2 -translate-y-1/2 text-white/80 hover:text-white p-3" aria-label="Berikutnya">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
    </button>
    <img id="lb-img" src="" alt="" class="max-w-[92vw] max-h-[88vh] object-contain shadow-2xl" />
    <p id="lb-caption" class="absolute bottom-6 left-0 right-0 text-center text-white/90 text-sm px-4"></p>
  </div>

  <div id="footer"></div>

  <script type="module" src="/src/pages/gallery.js"></script>
</body>
</html>
