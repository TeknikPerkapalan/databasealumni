<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password · Portal Alumni Perkapalan UNDIP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/src/config/tailwind.js"></script>
  <link rel="stylesheet" href="/src/styles/main.css" />
  <script src="/env.js" onerror=""></script>
</head>
<body class="bg-[#fafbfc] min-h-screen grid place-items-center">
  <main class="w-full max-w-md px-4 py-8">
    <div class="card p-8">
      <a href="/" class="inline-flex items-center gap-2 text-navy-900 font-display font-semibold text-lg mb-6">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18a5 5 0 0 1 0-10 7 7 0 0 1 13.9-1 5.5 5.5 0 0 1 1.6 10"/><path d="M12 12v8"/><path d="m8 16 4 4 4-4"/></svg>
        Portal Alumni
      </a>
      <h1 class="font-display text-2xl font-semibold text-navy-950">Atur Ulang Password</h1>
      <p class="text-slate-600 mt-2 text-sm">Masukkan password baru Anda di bawah.</p>

      <form id="reset-form" class="mt-6 space-y-4">
        <div>
          <label class="label">Password Baru</label>
          <input id="password" type="password" class="input" minlength="8" required />
          <p class="text-xs text-slate-500 mt-1">Minimal 8 karakter.</p>
        </div>
        <div>
          <label class="label">Ulangi Password</label>
          <input id="confirm" type="password" class="input" minlength="8" required />
        </div>
        <button type="submit" id="btn-submit" class="btn btn-primary w-full">Simpan Password</button>
      </form>
      <p class="mt-6 text-sm text-slate-500 text-center">
        Sudah ingat? <a href="/login.html" class="text-navy-900 font-medium hover:text-gold-700">Kembali ke login</a>
      </p>
    </div>
  </main>

  <script type="module">
    import { supabase } from '/src/config/supabase.js';
    import { toast }    from '/src/utils/toast.js';

    const $ = (s) => document.querySelector(s);

    document.querySelector('#reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = $('#password').value;
      const cf = $('#confirm').value;
      if (pw !== cf) { toast.error('Password tidak cocok'); return; }
      const btn = $('#btn-submit');
      btn.disabled = true; btn.textContent = 'Menyimpan...';
      try {
        const { error } = await supabase.auth.updateUser({ password: pw });
        if (error) throw error;
        toast.success('Password berhasil diubah!');
        setTimeout(() => window.location.href = '/login.html', 1200);
      } catch (err) {
        toast.error(err.message || 'Gagal mengubah password');
        btn.disabled = false; btn.textContent = 'Simpan Password';
      }
    });
  </script>
</body>
</html>
