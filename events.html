<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalender Kegiatan · Portal Alumni Perkapalan UNDIP</title>
  <meta name="description" content="Kalender kegiatan alumni — reuni, gathering, workshop, dan acara komunitas." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/src/config/tailwind.js"></script>

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/main.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

  <link rel="stylesheet" href="/src/styles/main.css" />
  <script src="/env.js" onerror=""></script>
</head>
<body class="bg-[#fafbfc]">
  <div id="navbar"></div>

  <section class="bg-navy-950 text-white hero-grid">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 lg:py-24">
      <p class="text-gold-400 text-sm font-medium tracking-wide uppercase">Agenda Komunitas</p>
      <h1 class="font-display font-semibold text-4xl sm:text-5xl mt-2">Kalender Kegiatan</h1>
      <p class="mt-3 text-slate-300 max-w-2xl">Jangan lewatkan kegiatan alumni — reuni, gathering, sharing session, dan lainnya.</p>
    </div>
  </section>

  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 grid lg:grid-cols-12 gap-6">
    <div class="lg:col-span-8">
      <div class="card p-4 lg:p-6">
        <div id="calendar"></div>
      </div>
    </div>

    <aside class="lg:col-span-4">
      <h2 class="font-display text-2xl font-semibold text-navy-950 mb-4">Acara Mendatang</h2>
      <div id="upcoming-list" class="space-y-4"></div>
    </aside>
  </section>

  <!-- Event Popup -->
  <div id="event-modal" class="fixed inset-0 z-[100] hidden">
    <div class="absolute inset-0 bg-black/60" id="modal-backdrop"></div>
    <div class="relative max-w-lg mx-auto top-1/2 -translate-y-1/2 bg-white rounded-2xl shadow-2xl overflow-hidden">
      <div id="modal-banner" class="aspect-[16/9] bg-navy-900 hero-grid relative">
        <button id="modal-close" class="absolute top-3 right-3 p-2 rounded-full bg-white/90 hover:bg-white text-navy-950" aria-label="Tutup">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="p-6">
        <h3 id="modal-title" class="font-display text-xl font-semibold text-navy-950"></h3>
        <p id="modal-date" class="text-sm text-slate-500 mt-1"></p>
        <p id="modal-location" class="text-sm text-slate-700 mt-3 flex items-center gap-2"></p>
        <p id="modal-desc" class="text-sm text-slate-600 mt-3 whitespace-pre-line"></p>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script type="module" src="/src/pages/events.js"></script>
</body>
</html>
