<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lowongan Kerja · Portal Alumni Perkapalan UNDIP</title>
  <meta name="description" content="Lowongan kerja terbaru di industri maritim, galangan kapal, offshore, dan terkait." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/src/config/tailwind.js"></script>
  <link rel="stylesheet" href="/src/styles/main.css" />
  <script src="/env.js" onerror=""></script>
</head>
<body class="bg-[#fafbfc]">
  <div id="navbar"></div>

  <section class="bg-navy-950 text-white hero-grid">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 lg:py-24">
      <p class="text-gold-400 text-sm font-medium tracking-wide uppercase">Karir</p>
      <h1 class="font-display font-semibold text-4xl sm:text-5xl mt-2">Lowongan Kerja</h1>
      <p class="mt-3 text-slate-300 max-w-2xl">Kesempatan karir terkini di industri maritim dan terkait — dikurasi dari, oleh, dan untuk alumni.</p>
    </div>
  </section>

  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 -mt-10 relative z-10">
    <div class="bg-white rounded-2xl shadow-soft ring-1 ring-slate-200 p-5 lg:p-6">
      <div class="grid lg:grid-cols-5 md:grid-cols-2 gap-3">
        <div class="lg:col-span-2">
          <label class="label">Cari posisi / perusahaan</label>
          <input id="f-search" type="text" class="input" placeholder="Naval Architect, PT PAL…" />
        </div>
        <div>
          <label class="label">Tipe</label>
          <select id="f-type" class="select">
            <option value="">Semua</option>
            <option value="full_time">Full-time</option>
            <option value="part_time">Part-time</option>
            <option value="contract">Contract</option>
            <option value="internship">Magang</option>
            <option value="freelance">Freelance</option>
          </select>
        </div>
        <div>
          <label class="label">Lokasi</label>
          <input id="f-location" type="text" class="input" placeholder="Surabaya, Batam…" />
        </div>
        <div class="flex items-end gap-2">
          <button id="btn-apply" class="btn btn-primary flex-1">Terapkan</button>
          <button id="btn-reset" class="btn btn-ghost">Reset</button>
        </div>
      </div>
    </div>
  </section>

  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 grid lg:grid-cols-12 gap-6">
    <div class="lg:col-span-7">
      <div id="job-list" class="space-y-4"></div>
      <div id="pagination" class="flex items-center justify-center gap-2 mt-8"></div>
    </div>

    <aside class="lg:col-span-5">
      <div id="job-detail" class="lg:sticky lg:top-24 card p-6">
        <div class="text-center py-16 text-slate-400">
          <svg class="mx-auto mb-3" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
          <p>Pilih lowongan untuk melihat detail.</p>
        </div>
      </div>
    </aside>
  </section>

  <div id="footer"></div>

  <script type="module" src="/src/pages/jobs.js"></script>
</body>
</html>
